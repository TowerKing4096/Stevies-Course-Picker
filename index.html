<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PGA Course Picker</title>
<meta name="theme-color" content="#0b3d24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PGA Picker">
<link rel="icon" href="avatar_lyndon.png">
<link rel="apple-touch-icon" href="avatar_lyndon.png">
<style>
:root{
  --bg1:#0b3d24;
  --bg2:#0f5c33;
  --card:#0e2a1a;
  --accent:#d4ff5f;
  --text:#f2fff0;
  --muted:#9fd3ad;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background: radial-gradient(circle at 30% 20%, var(--bg2), var(--bg1) 70%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100%;
  padding: 24px;
}
.wrap{width:100%;max-width:480px;text-align:center;}
.header{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 24px 0;}
.avatar{
  width:64px;height:64px;border-radius:50%;
  border:2px solid var(--accent);
  object-fit:cover;flex:0 0 auto;
  box-shadow: 0 6px 18px rgba(0,0,0,0.35);
}
h1{
  font-size:1.1rem;font-weight:600;letter-spacing:0.04em;
  text-transform:uppercase;color:var(--muted);margin:0;text-align:left;
}
.title-block{text-align:left;min-width:0;}
.tagline{
  font-size:0.95rem;line-height:1.35;color:var(--text);
  margin-top:6px;min-height:1.35em;opacity:0.9;
}
.digits{display:flex;gap:16px;justify-content:center;margin-bottom:20px;}
.card{
  background: var(--card);
  border: 1px solid rgba(212,255,95,0.25);
  border-radius: 20px;
  padding: 28px 12px;
  flex: 1;
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}
.label{font-size:0.8rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--muted);margin-bottom:10px;}
.digit{
  font-size:5rem;font-weight:800;line-height:1;color:var(--accent);
  font-variant-numeric: tabular-nums;transition: transform 0.15s ease;
}
.digit.roll{transform: scale(1.08);}
.course-card{
  background: var(--card);
  border: 1px solid rgba(212,255,95,0.3);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 24px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}
.course-img{
  display:none;
  width:100%;
  aspect-ratio: 5 / 4;
  object-fit: cover;
  border-radius: 12px;
}
.course-img.show{display:block;}
button{
  background: var(--accent);color:#0b3d24;border:none;border-radius:999px;
  padding:16px 40px;font-size:1.05rem;font-weight:700;letter-spacing:0.03em;cursor:pointer;
  box-shadow: 0 8px 20px rgba(212,255,95,0.25);
}
button:active{transform: scale(0.97);}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <img class="avatar" src="avatar_lyndon.png" alt="Lyndon">
    <div class="title-block">
      <h1 id="appTitle">Lyndon's PGA Course Selector</h1>
      <div class="tagline" id="tagline"></div>
    </div>
  </div>

  <div class="digits">
    <div class="card">
      <div class="label">Page</div>
      <div class="digit" id="digit1">&ndash;</div>
    </div>
    <div class="card">
      <div class="label">Course</div>
      <div class="digit" id="digit2">&ndash;</div>
    </div>
  </div>

  <div class="course-card">
    <img class="course-img" id="courseImg" alt="">
  </div>

  <button id="rollBtn">Roll</button>
</div>

<script>
// Optional personalisation: ?player=Name changes the title
const urlParams = new URLSearchParams(window.location.search);
const playerName = urlParams.get('player');
if (playerName) {
  document.getElementById('appTitle').textContent = `${playerName}'s PGA Course Selector`;
}

// Courses as they appear in-game, grouped by the game's page and slot order.
// Page 7 has 5 courses (Charles Schwab Challenge Course is excluded).
const courseMatrix = {
  1: ["Royal Birkdale Golf Club","Aronimink Golf Club","Duzznt Matta Country Club","Fields Ranch East at PGA Frisco",
      "Shinnecock Hills Golf Club","Rusty Meadows Golf Club","Barren Gorge","The Old Course at St Andrews Links"],
  2: ["Royal Portrush Golf Club","Quail Hollow Club","Pebble Beach Golf Links","TPC Sawgrass",
      "Oakmont Country Club","Huntington Sound","East Lake Golf Club","Riviera Country Club"],
  3: ["TPC Scottsdale","Marigot Cove GC","Pinehurst No. 2","Spyglass Hill Golf Course",
      "Salem Creek CC","Calamity Bay Golf Club","TPC Summerlin","Torrey Pines South"],
  4: ["Torrey Pines North","Payne's Valley","Copperhead Course at Innisbrook","TPC San Antonio",
      "Bay Hill Club & Lodge","Top of the Rock","St. George's Golf & CC","TPC Southwind"],
  5: ["TPC River Highlands","TPC Deere Run","TPC Boston","Detroit Golf Club",
      "TPC Twin Cities","TPC Louisiana","Al Barsha Resort - Palms Course","Atlantic Beach CC"],
  6: ["Yoho River Golf Course","Playa Saona Golf Course","Lone Grove Golf Course","Greenmont Country Club",
      "The Elevens Club","Nipawin Golf & CC","Highfield Golf Course","Georgetown Island GC"],
  7: ["Emery Beach CC","Central Otago Golf Club","Hauteluce","Eagle Hill Country Club","Al Barsha Resort - Sands Course"]
};

// Same rule used for the image filenames: lowercase, apostrophes removed,
// everything else non-alphanumeric becomes an underscore.
function slugify(name) {
  return name.toLowerCase().replace(/'/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
}

const d1 = document.getElementById('digit1');
const d2 = document.getElementById('digit2');
const courseImg = document.getElementById('courseImg');
const btn = document.getElementById('rollBtn');
const taglineEl = document.getElementById('tagline');

const taglines = [
  "That’s a very stiff shaft you’ve got there.",
  "I need a mulligan — my stroke was way off.",
  "Careful, that hole’s tighter than it looks.",
  "Grip it firm and swing it smooth.",
  "My driver’s got incredible length.",
  "That putt slipped right in the back door.",
  "Keep it in the fairway, or in my direction.",
  "I always finish strong on the 18th.",
  "That’s a hole worth respecting.",
  "Nice stroke — didn’t even feel that club.",
  "My grip’s firm, but my swing is smooth.",
  "That shaft’s seen better days — needs a regrip.",
  "I like my putts long and my rounds longer.",
  "He handled that slope better than expected.",
  "She’s got a swing you can’t teach.",
  "My irons are hot, and so is my short game.",
  "A soft touch on the green goes a long way.",
  "That ball dropped in without a sound.",
  "I never lay up — I go for it every time.",
  "Some holes need finesse, not force.",
  "Another year older, still swinging strong.",
  "Hope your birthday round stays under par.",
  "You’ve aged like a well-oiled driver.",
  "Here’s to a birdie kind of birthday.",
  "May your putts be smooth and your cake bigger than your handicap.",
  "Blow out the candles like you’re teeing off.",
  "A whole year wiser, still can’t read a green.",
  "Cheers to another trip around the sun and the course.",
  "You’re par-none on your big day.",
  "Time to celebrate — no bogeys allowed today.",
  "What happens on the back nine stays on the back nine.",
  "Pack the clubs, pack the jokes, pack the patience.",
  "Last one to the cart buys the first round.",
  "A golf trip without a few naughty jokes isn’t a real golf trip.",
  "Whoever loses the match buys drinks at the 19th hole.",
  "Nothing bonds a group faster than a bad shank and a good laugh.",
  "Golf trips: where handicaps and inhibitions both disappear.",
  "The real bachelor party test is who can putt after three beers.",
  "Every trip needs one guy who takes it way too seriously.",
  "Golf carts and group chats — the two best places for a bad joke.",
  "Swinging into the weekend with style.",
  "Under par, over the moon.",
  "Fairways and flirty ways.",
  "Rough day, smoother finish.",
  "Chasing birdies, not perfection.",
  "Tee time is my happy hour.",
  "Life’s better with a scorecard in hand.",
  "Bunkers build character.",
  "Caption this: one long drive away from perfect.",
  "Golf: the only sport where “in the hole” is a compliment.",
  "Ready for a round later? I’ll bring the good jokes.",
  "My swing’s better after two drinks — don’t judge.",
  "Let’s tee off before it gets too hot.",
  "I owe you a mulligan from last time.",
  "You in for nine holes and bad puns?",
  "My short game needs work, but my jokes don’t.",
  "Scorecard says I need practice, my ego says otherwise.",
  "Meet at the clubhouse, bring your sense of humour.",
  "I’ll bring the clubs, you bring the snacks.",
  "Last round of golf turned into a comedy show.",
  "My stroke’s improved, my patience hasn’t.",
  "That drive went further than expected — impressive.",
  "Some rounds need a firm hand and a soft touch.",
  "I’ve got the grip, the swing, and the confidence to match.",
  "He plays it safe off the tee — I don’t.",
  "That putt was smoother than my last excuse for losing.",
  "A good caddy knows when to speak and when not to.",
  "My short game’s better than my long game — don’t ask why.",
  "Every round has one shot you can’t explain to your partner.",
  "The 19th hole always tells the best stories.",
  "She reads greens better than she reads people.",
  "I never apologize for a good drive.",
  "That shot had more spin than a politician.",
  "My handicap’s high, my confidence is higher.",
  "Golf’s the only sport where “nice hole” is a real compliment."
];


const pageNumbers = Object.keys(courseMatrix).map(Number);

function roll() {
  const page = pageNumbers[Math.floor(Math.random() * pageNumbers.length)];
  const courses = courseMatrix[page];
  const slotIndex = Math.floor(Math.random() * courses.length);
  const slot = slotIndex + 1;
  const name = courses[slotIndex];

  d1.classList.add('roll');
  d2.classList.add('roll');
  d1.textContent = page;
  d2.textContent = slot;

  // Show the matching image; hide it if the file is missing
  courseImg.classList.remove('show');
  courseImg.onload = () => courseImg.classList.add('show');
  courseImg.onerror = () => courseImg.classList.remove('show');
  courseImg.alt = name;
  courseImg.src = `app_images/${slugify(name)}.png`;

  taglineEl.textContent = taglines[Math.floor(Math.random() * taglines.length)];

  setTimeout(() => {
    d1.classList.remove('roll');
    d2.classList.remove('roll');
  }, 150);
}

btn.addEventListener('click', roll);
</script>
</body>
</html>
